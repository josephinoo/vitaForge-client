[package]
name = "vitaforge-client"
version = "0.1.0"
edition = "2021"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true

[dependencies]
dotenvy = "0.15.7"
fluent-bundle = "0.16"
gpui-kit = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
