name: release

# Releases are cut only by pushing/merging into the `release` branch (never from dev).
# The version comes from Cargo.toml; bump it in dev before merging to release.
on:
  push:
    branches: [release]

permissions:
  contents: write

env:
  # secret baked into the binary at build time (see src/api.rs); never committed
  VITAFORGE_API: ${{ secrets.VITAFORGE_API }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Fail if this version was already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::v${{ steps.v.outputs.version }} already released - bump version in Cargo.toml"; exit 1
          fi

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist/VitaForge.app/Contents/{MacOS,Resources}
          lipo -create -output dist/VitaForge.app/Contents/MacOS/vitaforge-client \
            target/aarch64-apple-darwin/release/vitaforge-client \
            target/x86_64-apple-darwin/release/vitaforge-client
          cp packaging/icon.icns dist/VitaForge.app/Contents/Resources/icon.icns
          VER="${{ needs.version.outputs.version }}"
          sed "s/__VERSION__/$VER/g" packaging/Info.plist > dist/VitaForge.app/Contents/Info.plist
          # ad-hoc signature; replace with a Developer ID + notarytool step to avoid Gatekeeper warnings
          codesign --force --deep -s - dist/VitaForge.app
          hdiutil create -volname VitaForge -srcfolder dist/VitaForge.app -ov -format UDZO VitaForge-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: VitaForge-macos-universal.dmg }

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: Compress-Archive target/release/vitaforge-client.exe VitaForge-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: VitaForge-windows-x64.zip }

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (GPUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libx11-xcb-dev libvulkan-dev libasound2-dev libfontconfig-dev \
            libfreetype6-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        run: |
          d=VitaForge-linux-x64; mkdir $d
          cp target/release/vitaforge-client packaging/vitaforge-client.desktop packaging/vitaforge-client.png $d/
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: VitaForge-linux-x64.tar.gz }

  publish:
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*
          generate_release_notes: true
